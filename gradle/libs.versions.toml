# Single source of truth for dependency and plugin versions. Referenced from
# build.gradle.kts and the convention plugins in buildSrc.
[versions]
awssdk = "2.47.1"
junit = "6.1.1"
junit-platform = "6.1.1"
mockito = "5.23.0"
jsr305 = "3.0.2"
spotbugs-annotations = "4.8.6"
errorprone-core = "2.36.0"
palantir-java-format = "2.89.0"
checkstyle-tool = "10.18.2"
spotless-plugin = "8.7.0"
errorprone-plugin = "4.1.0"
spotbugs-plugin = "6.1.2"

[libraries]
# AWS SDK — BOM manages versions for the rest, only awssdk-bom needs a version
awssdk-bom = { module = "software.amazon.awssdk:bom", version.ref = "awssdk" }
awssdk-annotations = { module = "software.amazon.awssdk:annotations" }
awssdk-rolesanywhere = { module = "software.amazon.awssdk:rolesanywhere" }
awssdk-apache-client = { module = "software.amazon.awssdk:apache-client" }
awssdk-auth = { module = "software.amazon.awssdk:auth" }
awssdk-http-auth-spi = { module = "software.amazon.awssdk:http-auth-spi" }
awssdk-arns = { module = "software.amazon.awssdk:arns" }
awssdk-json-utils = { module = "software.amazon.awssdk:json-utils" }

# Test
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit-platform" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }

# Static analysis annotations (compileOnly)
findbugs-jsr305 = { module = "com.google.code.findbugs:jsr305", version.ref = "jsr305" }
spotbugs-annotations = { module = "com.github.spotbugs:spotbugs-annotations", version.ref = "spotbugs-annotations" }
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone-core" }

# Convention-plugin dependencies (used in buildSrc/build.gradle.kts)
spotless-plugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless-plugin" }
errorprone-plugin = { module = "net.ltgt.gradle:gradle-errorprone-plugin", version.ref = "errorprone-plugin" }
spotbugs-plugin = { module = "com.github.spotbugs.snom:spotbugs-gradle-plugin", version.ref = "spotbugs-plugin" }
